name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API — lint, build, prisma validate, migrate (postgres service)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: kroto_ci }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: apps/api/package-lock.json }
      - run: npm ci
      - run: npx prisma validate
        env: { DATABASE_URL: postgresql://postgres:ci@localhost:5432/kroto_ci }
      - run: npx prisma generate
      - run: npm run build
      - run: npx prisma migrate deploy
        env: { DATABASE_URL: postgresql://postgres:ci@localhost:5432/kroto_ci }
      - name: Seed smoke test
        run: npm run db:seed
        env:
          DATABASE_URL: postgresql://postgres:ci@localhost:5432/kroto_ci
          CODE_ENCRYPTION_KEY: ${{ secrets.CI_CODE_ENCRYPTION_KEY || 'MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=' }}

  web:
    name: Web — Next.js build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm install
      - run: npm run build

  compose-config:
    name: docker compose config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose config -q
